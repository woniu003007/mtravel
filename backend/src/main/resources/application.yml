server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mtravel-platform-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:mtravel}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # 内部业务系统低并发运行时只常驻一个连接，出现并发请求时最多扩到五个。
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      data-source-properties:
        ApplicationName: ${DB_APPLICATION_NAME:mtravel-backend}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    doc-expansion: none
    operations-sorter: alpha
    tags-sorter: alpha

mtravel:
  agent:
    service-token:
      raw-token: ${AGENT_SERVICE_TOKEN:}
      tenant-id: ${AGENT_SERVICE_TOKEN_TENANT_ID:}
      token-name: ${AGENT_SERVICE_TOKEN_NAME:customer-service-agent}
      scopes: ${AGENT_SERVICE_TOKEN_SCOPES:agent:read:customer-context,agent:read:product,agent:read:schedule,agent:read:policy,agent:read:quote-request,agent:write:quote-request,agent:write:handoff}
      expires-at: ${AGENT_SERVICE_TOKEN_EXPIRES_AT:}
  tenant:
    default-tenant-id: ${DEFAULT_TENANT_ID:1}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-please-use-a-strong-secret-key-32bytes}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:43200}
    idle-timeout-minutes: ${IDLE_TIMEOUT_MINUTES:120}
    session-timeout-enabled: ${SESSION_TIMEOUT_ENABLED:false}
    demo-username: ${DEMO_USERNAME:admin}
    demo-password: ${DEMO_PASSWORD:123456}
