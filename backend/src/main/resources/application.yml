server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mtravel-platform-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mtravel}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

mtravel:
  tenant:
    default-tenant-id: ${DEFAULT_TENANT_ID:1}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-please-use-a-strong-secret-key-32bytes}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:120}
    idle-timeout-minutes: ${IDLE_TIMEOUT_MINUTES:120}
    demo-username: ${DEMO_USERNAME:admin}
    demo-password: ${DEMO_PASSWORD:123456}
